services:
  trade-erp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trade-erp-v0.14.0
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=postgresql://trade_erp:Admin123!@host.docker.internal:5432/trade_erp?schema=public
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - trade-erp-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  gbrain-db:
    image: pgvector/pgvector:pg16
    container_name: gbrain-db
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: gbrain
      POSTGRES_USER: gbrain
      POSTGRES_PASSWORD: gbrain2026
    volumes:
      - gbrain_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gbrain -d gbrain"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  trade-erp-network:
    driver: bridge

volumes:
  gbrain_data:
